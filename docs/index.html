<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KALE — Live Monitor</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0c10;
      color: #e8edf5;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #242936;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: #8993a5; font-size: 12px; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-refresh {
      background: #1e2530;
      color: #e8edf5;
      border: 1px solid #323b4d;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-refresh:hover {
      background: #2b3546;
    }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #12151c;
      border: 1px solid #242936;
      border-radius: 12px;
      padding: 16px;
    }
    .label { color: #8993a5; font-size: 11px; margin-bottom: 6px; text-transform: uppercase; }
    .value { font-size: 20px; font-weight: bold; }
    #matches { display: grid; gap: 12px; }
    .match {
      background: #12151c;
      border: 1px solid #242936;
      border-radius: 12px;
      padding: 16px;
    }
    .teams { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
    .meta { color: #8993a5; font-size: 12px; margin-bottom: 12px; }
    .prediction { border-top: 1px solid #242936; padding-top: 12px; line-height: 1.6; font-size: 14px; }
    .recommendation {
      background: #17211b;
      border: 1px solid #234230;
      color: #7ee787;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .warning {
      padding: 15px;
      border: 1px solid #5a4b20;
      background: #17150d;
      border-radius: 10px;
      color: #d9c67a;
    }
    .error { color: #ff8d8d; background: #221414; border-color: #522525; }
    footer { padding: 25px 20px; color: #667085; font-size: 11px; text-align: center; }
  </style>
</head>

<body>

<header>
  <div>
    <h1>KALE — Live Monitor</h1>
    <div class="sub">GOALDIR Football API v2 · KALE Prediction Engine</div>
  </div>
  <div class="header-actions">
    <button class="btn-refresh" onclick="loadData()">🔄 Verileri Yenile</button>
  </div>
</header>

<main>

  <div class="grid">
    <div class="card">
      <div class="label">ENGINE STATUS</div>
      <div class="value" id="status">Bağlanıyor...</div>
    </div>
    <div class="card">
      <div class="label">TOPLAM MAÇ</div>
      <div class="value" id="matchCount">0</div>
    </div>
    <div class="card">
      <div class="label">GEÇMİŞ MAÇLAR</div>
      <div class="value" id="historyCount">0</div>
    </div>
    <div class="card">
      <div class="label">SON GÜNCELLEME</div>
      <div class="value" id="updated" style="font-size: 14px; margin-top: 4px;">—</div>
    </div>
  </div>

  <div id="message"></div>

  <h2 style="font-size: 18px; margin-top: 25px;">KALE Tahminleri ve Fikstür</h2>

  <div id="matches"></div>

</main>

<footer>
  KALE automated monitoring interface
</footer>

<script>
async function loadData() {
  const status = document.getElementById("status");
  const matchCount = document.getElementById("matchCount");
  const historyCount = document.getElementById("historyCount");
  const updated = document.getElementById("updated");
  const matches = document.getElementById("matches");
  const message = document.getElementById("message");

  status.textContent = "Güncelleniyor...";

  try {
    const response = await fetch("./data/latest.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("latest.json yüklenemedi. Arka plan motorunun veriyi üretmesi bekleniyor.");
    }

    const data = await response.json();

    status.textContent = data.prediction_engine ? "Aktif (" + data.prediction_engine + ")" : "Çalışıyor";

    const list = Array.isArray(data.fixtures) ? data.fixtures : (Array.isArray(data.matches) ? data.matches : []);

    matchCount.textContent = list.length;
    historyCount.textContent = data.historical_matches || 0;

    updated.textContent = data.generated_at
      ? new Date(data.generated_at).toLocaleTimeString()
      : "—";

    message.innerHTML = "";
    matches.innerHTML = "";

    if (!list.length) {
      matches.innerHTML = '<div class="warning">Henüz doğrulanmış bir KALE tahmin verisi bulunamadı veya liste boş.</div>';
      return;
    }

    list.forEach(function(match) {
      const home = match.home || match.home_team || "—";
      const away = match.away || match.away_team || "—";
      const league = match.league_name || match.league || "—";
      const kickoff = match.date || match.kickoff || "—";
      const prediction = match.prediction || {};
      const probs = prediction.probabilities || {};

      const card = document.createElement("div");
      card.className = "match";

      let predHtml = "";
      if (prediction.available === false) {
        predHtml = `<div class="error" style="padding: 10px; border-radius: 6px;">Tahmin oluşturulamadı: ${escapeHtml(prediction.reason || "Yetersiz veri")}</div>`;
      } else {
        // Hangi tarafın kazanma ihtimali yüksek bulalım (Tavsiye üretelim)
        let recommendationText = "Analiz ediliyor...";
        const hProb = Number(probs.home) || Number(match.home_probability) || 0;
        const dProb = Number(probs.draw) || Number(match.draw_probability) || 0;
        const aProb = Number(probs.away) || Number(match.away_probability) || 0;

        if (hProb > 0 || dProb > 0 || aProb > 0) {
          const maxP = Math.max(hProb, dProb, aProb);
          if (maxP === hProb) recommendationText = `🏆 KALE Tavsiyesi: ${home} Kazanır (MS 1)`;
          else if (maxP === aProb) recommendationText = `🏆 KALE Tavsiyesi: ${away} Kazanır (MS 2)`;
          else recommendationText = `🏆 KALE Tavsiyesi: Beraberlik (MS X)`;
        } else if (prediction.most_likely) {
          recommendationText = `🏆 En Muhtemel Skor: ${prediction.most_likely}`;
        }

        predHtml = `
          <div class="recommendation">
            ${recommendationText}
          </div>
          <div>
            <strong>En Muhtemel Skor:</strong> ${escapeHtml(prediction.most_likely || match.most_likely || "—")}
          </div>
          <div>
            <strong>Ev Sahibi Kazanma:</strong> ${formatPercent(hProb)}
          </div>
          <div>
            <strong>Beraberlik:</strong> ${formatPercent(dProb)}
          </div>
          <div>
            <strong>Deplasman Kazanma:</strong> ${formatPercent(aProb)}
          </div>
          <div>
            <strong>Model Güveni:</strong> ${formatPercent(prediction.confidence)}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="teams">
          ${escapeHtml(home)} vs ${escapeHtml(away)}
        </div>
        <div class="meta">
          ${escapeHtml(league)} · ${escapeHtml(kickoff)}
        </div>
        <div class="prediction">
          ${predHtml}
        </div>
      `;

      matches.appendChild(card);
    });

  } catch (error) {
    status.textContent = "Hata";
    message.innerHTML = '<div class="warning error">' + escapeHtml(error.message) + '</div>';
  }
}

function formatPercent(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) { return "—"; }
  // Eğer değer 0-1 arası değilse (örneğin direkt yüzde verilmişse) düzeltme
  const formatted = n > 1 ? n : n * 100;
  return formatted.toFixed(1) + "%";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Sayfa açıldığında otomatik yükle
loadData();

// Her 30 saniyede bir otomatik arka planda verileri tazele
setInterval(loadData, 30000);
</script>

</body>
</html>
