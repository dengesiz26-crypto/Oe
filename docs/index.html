<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KALE — Live Monitor</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0c10;
      color: #e8edf5;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #242936;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .sub { color: #8993a5; font-size: 13px; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #12151c;
      border: 1px solid #242936;
      border-radius: 12px;
      padding: 16px;
    }
    .label { color: #8993a5; font-size: 12px; margin-bottom: 8px; }
    .value { font-size: 22px; font-weight: bold; }
    #matches { display: grid; gap: 12px; }
    .match {
      background: #12151c;
      border: 1px solid #242936;
      border-radius: 12px;
      padding: 16px;
    }
    .teams { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .meta { color: #8993a5; font-size: 12px; margin-bottom: 12px; }
    .prediction { border-top: 1px solid #242936; padding-top: 12px; line-height: 1.7; }
    .warning {
      padding: 15px;
      border: 1px solid #5a4b20;
      background: #17150d;
      border-radius: 10px;
      color: #d9c67a;
    }
    .error { color: #ff8d8d; }
    footer { padding: 25px 20px; color: #667085; font-size: 11px; text-align: center; }
  </style>
</head>

<body>

<header>
  <h1>KALE — Live Monitor</h1>
  <div class="sub">
    GOALDIR Football API v2 · KALE prediction engine
  </div>
</header>

<main>

  <div class="grid">
    <div class="card">
      <div class="label">ENGINE STATUS</div>
      <div class="value" id="status">Online</div>
    </div>
    <div class="card">
      <div class="label">UPCOMING MATCHES</div>
      <div class="value" id="matchCount">0</div>
    </div>
    <div class="card">
      <div class="label">HISTORICAL MATCHES</div>
      <div class="value" id="historyCount">0</div>
    </div>
    <div class="card">
      <div class="label">LAST UPDATE</div>
      <div class="value" id="updated">—</div>
    </div>
  </div>

  <div id="message"></div>

  <h2>KALE Predictions & Fixtures</h2>

  <div id="matches"></div>

</main>

<footer>
  KALE monitoring interface
</footer>

<script>
async function loadData() {
  const status = document.getElementById("status");
  const matchCount = document.getElementById("matchCount");
  const historyCount = document.getElementById("historyCount");
  const updated = document.getElementById("updated");
  const matches = document.getElementById("matches");
  const message = document.getElementById("message");

  try {
    // Flask sunucusu üzerinden veya statik dosya olarak çağırın
    const response = await fetch("./data/latest.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("latest.json could not be loaded. Run python app.py --run first.");
    }

    const data = await response.json();

    status.textContent = data.prediction_engine ? "Active (" + data.prediction_engine + ")" : "Running";

    // Backend'den gelen doğru anahtar: "fixtures"
    const list = Array.isArray(data.fixtures) ? data.fixtures : [];

    matchCount.textContent = list.length;
    historyCount.textContent = data.historical_matches || 0;

    updated.textContent = data.generated_at
      ? new Date(data.generated_at).toLocaleString()
      : "—";

    message.innerHTML = "";
    matches.innerHTML = "";

    if (!list.length) {
      matches.innerHTML = '<div class="warning">No verified KALE prediction data available yet.</div>';
      return;
    }

    list.forEach(function(match) {
      const home = match.home || "—";
      const away = match.away || "—";
      const league = match.league_name || match.league || "—";
      const kickoff = match.date || "—";
      const prediction = match.prediction || {};
      const probs = prediction.probabilities || {};

      const card = document.createElement("div");
      card.className = "match";

      let predHtml = "";
      if (!prediction.available) {
        escapeHtml(prediction.reason || "insufficient evidence")
        predHtml = `<div class="error">Prediction withheld: ${escapeHtml(prediction.reason || "insufficient evidence")}</div>`;
      } else {
        predHtml = `
          <div>
            <strong>Most likely score:</strong> ${escapeHtml(prediction.most_likely || "—")}
          </div>
          <div>
            <strong>Home probability:</strong> ${formatPercent(probs.home)}
          </div>
          <div>
            <strong>Draw probability:</strong> ${formatPercent(probs.draw)}
          </div>
          <div>
            <strong>Away probability:</strong> ${formatPercent(probs.away)}
          </div>
          <div>
            <strong>Model Confidence:</strong> ${formatPercent(prediction.confidence)}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="teams">
          ${escapeHtml(home)} vs ${escapeHtml(away)}
        </div>
        <div class="meta">
          ${escapeHtml(league)} · ${escapeHtml(kickoff)}
        </div>
        <div class="prediction">
          ${predHtml}
        </div>
      `;

      matches.appendChild(card);
    });

  } catch (error) {
    status.textContent = "error";
    message.innerHTML = '<div class="warning error">' + escapeHtml(error.message) + '</div>';
  }
}

function formatPercent(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) { return "—"; }
  return (n * 100).toFixed(1) + "%";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
