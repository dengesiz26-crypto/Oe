<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Football — AI Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <a class="brand" href="index.html"><span class="brand-mark"></span>AI FOOTBALL</a>
  <nav class="mainnav">
    <a href="index.html">Home</a>
    <a href="live.html">Live</a>
    <a href="ai-picks.html" class="active">AI Picks</a>
    <a href="odds-ai.html">Odds &amp; AI</a>
    <a href="coupons.html">Coupons</a>
    <a href="results.html">Results</a>
  </nav>
</div></div>

<main class="wrap">
  <div class="page-head"><h1>AI Picks</h1><p>Every candidate market our engine scored, with its play/no-bet decision.</p></div>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;" id="filters"></div>
  <div id="picks-list"></div>
</main>
<footer><div class="wrap">A "BANKO" probability read does not always mean "PLAY" — see the decision column, which also checks price and risk.</div></footer>
<script src="js/app.js"></script>
<script>
(async function(){
  const latest = await loadJSON("data/latest.json");
  const picks = latest?.picks || [];
  const bands = ["ALL", "BANKO", "STANDARD", "IDEAL", "RISKLI", "UZAK DUR"];
  const filters = document.getElementById("filters");
  const list = document.getElementById("picks-list");

  function render(band){
    const shown = band === "ALL" ? picks : picks.filter(p => p.classification === band);
    list.innerHTML = shown.length ? shown.map(pickCardHTML).join("") : `<div class="empty">No picks in this band.</div>`;
  }

  filters.innerHTML = bands.map((b,i) => `<span class="badge" data-band="${b}" style="cursor:pointer;border:1px solid var(--border);${i===0?'background:var(--bg-inset);':''}">${b}</span>`).join("");
  filters.querySelectorAll("[data-band]").forEach(el => {
    el.addEventListener("click", () => {
      filters.querySelectorAll("[data-band]").forEach(e => e.style.background = "");
      el.style.background = "var(--bg-inset)";
      render(el.dataset.band);
    });
  });

  render("ALL");
})();
</script>
</body>
</html>
