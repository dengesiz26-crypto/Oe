name: KALE Live Monitor

on:
  workflow_dispatch:
  schedule:
    # Her saat başı çalışır (İsteğinize göre değiştirebilirsiniz, örn: '*/30 * * * *' 30 dakikada bir)
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-kale-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure directories exist
        run: |
          mkdir -p data
          mkdir -p docs

      # ---------------------------------------------------------
      # KALE Python Motorunu Çalıştırın
      # (Python dosyanızın adı neyse buradaki komutu ona göre güncelleyin)
      # ---------------------------------------------------------
      - name: Run KALE Prediction Engine
        env:
          GOALDIR_API_KEY: ${{ secrets.GOALDIR_API_KEY }} # Eğer API anahtarınız varsa Secret olarak ekleyebilirsiniz
        run: |
          python app.py --run

      # ---------------------------------------------------------
      # Güncellenen verileri GitHub'a otomatik commit & push yap
      # ---------------------------------------------------------
      - name: Commit and push latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/latest.json docs/index.html

          if git diff --cached --quiet; then
            echo "No changes in prediction data."
          else
            git commit -m "Auto-update KALE live monitor data [skip ci]"
            git push
          fi
