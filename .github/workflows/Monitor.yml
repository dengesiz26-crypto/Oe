name: KALE Live Monitor & Engine

on:
  workflow_dispatch:
  schedule:
    # Her saat başı çalışır
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-kale-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure directories exist
        run: |
          mkdir -p data
          mkdir -p docs/data

      # ---------------------------------------------------------
      # KALE Python Motorunu Çalıştırın
      # ---------------------------------------------------------
      - name: Run KALE Prediction Engine
        env:
          GOALDIR_API_KEY: ${{ secrets.GOALDIR_API_KEY }}
        run: |
          python -u app.py --run

      # ---------------------------------------------------------
      # KRİTİK ADIM: Üretilen JSON'u GitHub Pages'in okuyacağı docs/data/ altına kopyala
      # ---------------------------------------------------------
      - name: Copy latest.json to docs/data/
        run: |
          if [ -f "data/latest.json" ]; then
            cp data/latest.json docs/data/latest.json
            echo "Successfully copied latest.json to docs/data/latest.json"
          else
            echo "ERROR: data/latest.json was not generated by app.py!"
            exit 1
          fi

      # ---------------------------------------------------------
      # Güncellenen verileri GitHub'a otomatik commit & push yap
      # ---------------------------------------------------------
      - name: Commit and push latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/latest.json docs/data/latest.json docs/index.html

          if git diff --cached --quiet; then
            echo "No changes in prediction data."
          else
            git commit -m "Auto-update KALE live monitor data and sync to docs [skip ci]"
            git push
          fi
