name: KALE Prediction Engine Runner

on:
  # Her 6 saatte bir otomatik çalışır (İstediğiniz gibi ayarlayabilirsiniz)
  schedule:
    - cron: '0 */6 * * *'
  
  # GitHub arayüzünden manuel olarak "Run workflow" diyebilmenizi sağlar
  workflow_dispatch:

# Repoya yazma izni (JSON çıktısını otomatik commitleyip push edebilmek için)
permissions:
  contents: write

jobs:
  run-kale-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi flask flask-cors numpy requests

      - name: KALE Motorunu Çalıştır ve Tahminleri Üret
        env:
          GOALDIR_API_KEY: ${{ secrets.GOALDIR_API_KEY }}
        run: |
          python app.py

      - name: Değişiklikleri Git ile Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          
          # Üretilen JSON dosyalarını git'e ekle
          git add data/latest.json docs/data/latest.json || true
          
          # Eğer dosyalarda değişiklik olduysa commit at ve gönder
          git diff --staged --quiet || git commit -m "🤖 KALE: Güncel maç tahminleri ve oranlar otomatik güncellendi [skip ci]"
          git push
