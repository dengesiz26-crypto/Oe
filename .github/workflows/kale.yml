name: KALE Live Value Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  kale:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KALE
        env:
          GOALDIR_API_KEY: ${{ secrets.GOALDIR_API_KEY }}
        run: |
          python app.py --run

      - name: Save result
        run: |
          git config user.name "KALE Bot"
          git config user.email "kale-bot@users.noreply.github.com"

          git add data/latest.json

          git diff --cached --quiet || \
            git commit -m "Update KALE live data"

          git push
