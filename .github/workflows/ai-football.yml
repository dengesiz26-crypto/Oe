name: AI Football Pipeline

on:
  schedule:
    # 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC — adjust to your league's kickoff patterns
    - cron: "0 6,9,12,15,18,21 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GOALDIR_API_KEY: ${{ secrets.GOALDIR_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python scripts/run_pipeline.py

      - name: Commit updated data + docs
        run: |
          git config user.name "ai-football-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state data/cache docs/data
          git diff --quiet --cached || git commit -m "chore: pipeline update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
